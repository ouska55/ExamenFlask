<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Munchies - Fatou Bara</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .button-container a {
            display: block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .button-container a:hover {
            background-color: #45a049;
        }

        footer {
            margin-top: 30px;
            font-size: 14px;
            color: #777;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Bienvenue Fatou Bara</h1>
        <p>Dans la gestion de Munchies</p>

        <div class="button-container">
            <a href="http://127.0.0.1:5000/vendre">Gérer les ventes</a>
            <a href="http://127.0.0.1:5000/afficher_ventes">Afficher les ventes</a>
            <a href="http://127.0.0.1:5000/stock">Gérer le stock</a>
        </div>

        <footer>
            <p>&copy; 2025 Munchies. Tous droits réservés.</p>
        </footer>
    </div>

    <script>
        // Vous pouvez ajouter des fonctions JS supplémentaires ici si nécessaire
    </script>
</body>
</html>
